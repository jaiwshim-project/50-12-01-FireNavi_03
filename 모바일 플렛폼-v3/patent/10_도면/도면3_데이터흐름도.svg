<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <style>
    text { font-family: sans-serif; font-size: 11px; fill: #000000; }
    .ref { font-size: 12px; font-weight: bold; }
    .label { font-size: 10px; }
    .block { stroke: #000000; stroke-width: 1.5; fill: none; }
    .dashed { stroke: #000000; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
    .arrow { stroke: #000000; stroke-width: 1.2; fill: none; marker-end: url(#ah3); }
    .arrow-dash { stroke: #000000; stroke-width: 1.2; fill: none; stroke-dasharray: 5,3; marker-end: url(#ah3); }
    .layer-label { font-size: 9px; font-style: italic; }
  </style>
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="bold">[도면 3]</text>

  <!-- Layer labels (vertical, left side) -->
  <text x="12" y="105" class="layer-label" transform="rotate(-90,12,105)">Input</text>
  <text x="12" y="275" class="layer-label" transform="rotate(-90,12,275)">Processing</text>
  <text x="12" y="435" class="layer-label" transform="rotate(-90,12,435)">Output</text>

  <!-- Dashed layer separators -->
  <line x1="25" y1="170" x2="885" y2="170" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="25" y1="370" x2="885" y2="370" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- ========== INPUT LAYER ========== -->

  <!-- 101: Sensor Data -->
  <rect x="40" y="45" width="170" height="50" class="block"/>
  <text x="50" y="65" class="ref">101</text>
  <text x="90" y="65">센서 데이터</text>
  <text x="55" y="82" class="label">(Temperature, Smoke, CCTV)</text>

  <!-- 102: WiFi Signals -->
  <rect x="250" y="45" width="170" height="50" class="block"/>
  <text x="260" y="65" class="ref">102</text>
  <text x="300" y="65">WiFi 신호</text>
  <text x="265" y="82" class="label">(위치 측위 데이터)</text>

  <!-- 110: Standard Device -->
  <rect x="470" y="45" width="170" height="50" class="block"/>
  <text x="480" y="65" class="ref">110</text>
  <text x="520" y="65">표준 장치 ID</text>
  <text x="485" y="82" class="label">(Standard Device)</text>

  <!-- 120: Priority Device (dashed) -->
  <rect x="690" y="45" width="180" height="50" class="dashed"/>
  <text x="700" y="65" class="ref">120</text>
  <text x="740" y="65">우선구조 장치 ID</text>
  <text x="705" y="82" class="label">(Priority Rescue Device)</text>

  <!-- Input→Processing connection lines -->
  <line x1="45" y1="110" x2="40" y2="110" stroke="none"/>

  <!-- ========== PROCESSING LAYER ========== -->

  <!-- 210: Prediction Engine -->
  <rect x="40" y="195" width="200" height="60" class="block"/>
  <text x="50" y="215" class="ref">210</text>
  <text x="90" y="215">Prediction Engine</text>
  <text x="55" y="235" class="label">화재/연기 예측 → Risk Score</text>

  <!-- Arrow 101 → 210 -->
  <line x1="125" y1="95" x2="140" y2="195" class="arrow"/>

  <!-- 220: Behavior Engine -->
  <rect x="290" y="195" width="200" height="60" class="block"/>
  <text x="300" y="215" class="ref">220</text>
  <text x="340" y="215">Behavior Engine</text>
  <text x="305" y="235" class="label">군중 밀도 → 행동 분석</text>

  <!-- Arrow 102 → 220 -->
  <line x1="335" y1="95" x2="390" y2="195" class="arrow"/>

  <!-- 230: Decision Engine -->
  <rect x="540" y="195" width="200" height="60" class="block"/>
  <text x="550" y="215" class="ref">230</text>
  <text x="590" y="215">Decision Engine</text>
  <text x="555" y="235" class="label">위치 데이터 → 위치 매핑</text>

  <!-- Arrow 102 → 230 (location) -->
  <line x1="390" y1="70" x2="600" y2="195" class="arrow"/>

  <!-- Arrow 110/120 → 230 -->
  <line x1="555" y1="95" x2="640" y2="195" class="arrow"/>
  <line x1="780" y1="95" x2="700" y2="195" class="arrow-dash"/>

  <!-- 300: Integration (Risk Map) -->
  <rect x="250" y="290" width="400" height="55" class="block"/>
  <text x="260" y="310" class="ref">300</text>
  <text x="310" y="310">동적 리스크맵 통합</text>
  <text x="270" y="332" font-size="12" font-weight="bold">R(x,y,t) = w1*F + w2*S + w3*D + w4*C</text>

  <!-- Arrows 210,220,230 → 300 -->
  <line x1="140" y1="255" x2="310" y2="290" class="arrow"/>
  <line x1="390" y1="255" x2="420" y2="290" class="arrow"/>
  <line x1="640" y1="255" x2="550" y2="290" class="arrow"/>

  <!-- Variable labels on integration arrows -->
  <text x="195" y="268" class="label">F (화재위험도)</text>
  <text x="385" y="268" class="label">D (밀도)</text>
  <text x="575" y="268" class="label">S,C (연기,거리)</text>

  <!-- ========== OUTPUT LAYER ========== -->

  <!-- 500-1: Priority rescue routes (dashed box) -->
  <rect x="40" y="395" width="190" height="50" class="dashed"/>
  <text x="50" y="415" class="ref">500</text>
  <text x="90" y="415">우선구조 대피경로</text>
  <text x="55" y="432" class="label">(Priority Rescue Routes)</text>

  <!-- 500-2: Standard evacuation routes -->
  <rect x="270" y="395" width="190" height="50" class="block"/>
  <text x="280" y="415" class="ref">500</text>
  <text x="320" y="415">표준 대피경로</text>
  <text x="285" y="432" class="label">(Standard Evacuation Routes)</text>

  <!-- 500-3: Security alerts -->
  <rect x="500" y="395" width="160" height="50" class="block"/>
  <text x="510" y="415" class="ref">500</text>
  <text x="545" y="415">보안 알림</text>
  <text x="515" y="432" class="label">(Security Alerts)</text>

  <!-- 500-4: Statistics -->
  <rect x="700" y="395" width="160" height="50" class="block"/>
  <text x="710" y="415" class="ref">500</text>
  <text x="740" y="415">통계/보고</text>
  <text x="715" y="432" class="label">(Statistics)</text>

  <!-- Arrows 300 → outputs -->
  <line x1="350" y1="345" x2="135" y2="395" class="arrow-dash"/>
  <line x1="420" y1="345" x2="365" y2="395" class="arrow"/>
  <line x1="500" y1="345" x2="570" y2="395" class="arrow"/>
  <line x1="570" y1="345" x2="760" y2="395" class="arrow"/>

  <!-- 400: Mode indicator -->
  <rect x="770" y="290" width="110" height="55" class="block"/>
  <text x="780" y="310" class="ref">400</text>
  <text x="785" y="330" class="label">모드 관리부</text>

  <!-- Arrow 400 ↔ 300 -->
  <line x1="770" y1="318" x2="650" y2="318" class="arrow"/>

</svg>