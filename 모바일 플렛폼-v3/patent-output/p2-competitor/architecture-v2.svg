<svg width="1600" height="2000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradHeader2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c" />
    </marker>
    <marker id="arrowblue2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1600" height="2000" fill="#fafaf9"/>

  <!-- 헤더 -->
  <rect width="1600" height="110" fill="url(#gradHeader2)"/>
  <text x="800" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
    FireNavi v3.0 Architecture v2
  </text>
  <text x="800" y="80" font-family="Arial, sans-serif" font-size="18" fill="#fed7aa" text-anchor="middle">
    경쟁사 차별화 전략 반영 - 온톨로지 기반 통합 플랫폼
  </text>

  <!-- 경쟁사 vs FireNavi -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7c2d12">
    경쟁사 대비 7대 차별점
  </text>

  <rect x="50" y="170" width="1500" height="280" rx="10" fill="white" stroke="#ea580c" stroke-width="3" filter="url(#shadow2)"/>

  <!-- 차별점 그리드 -->
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    1️⃣ Google 대비: 고정 센서 → 스마트폰 로컬 감지 (0.3초 자동 활성화)
  </text>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • Nest 하드웨어 판매 의존 → FireNavi 소프트웨어 구독 ($4.99/월)
  </text>

  <text x="80" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    2️⃣ Apple 대비: 좌표 → 공간 온톨로지 노드 ("4층 동쪽 복도")
  </text>
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • UWB 비콘 필요 → FireNavi 기존 WiFi만 사용 (신규 설치 불필요)
  </text>

  <text x="80" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    3️⃣ IBM 대비: 기업용 → 개인 사용자 중심 (B2C + B2B)
  </text>
  <text x="100" y="355" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • 최소 계약 $100K → FireNavi 무료 체험 + 개인 구독
  </text>

  <text x="850" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    4️⃣ Samsung 대비: 범용 기능 → 재난 대피 전문 온톨로지
  </text>
  <text x="870" y="235" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • Bixby 범용 AI → FireNavi 재난 특화 삼중 엔진
  </text>

  <text x="850" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    5️⃣ Microsoft 대비: 인프라 제공 → 완제품 소유
  </text>
  <text x="870" y="295" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • Azure API만 → FireNavi 사용자 데이터 + 온톨로지 지속 개선
  </text>

  <text x="850" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    6️⃣ 중국 대비: 내수 중심 → 글로벌 다국어 (30개 언어)
  </text>
  <text x="870" y="355" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • 중국어만 → FireNavi 온톨로지 기반 다국어 자동 감지
  </text>

  <text x="80" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
    7️⃣ 일본 대비: 완벽주의 → 애자일 MVP (v1.0 → v2.0 → v3.0 빠른 개선)
  </text>
  <text x="100" y="415" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • 5년 R&D → FireNavi 3개월 MVP + 사용자 피드백 기반 개선
  </text>

  <!-- 핵심 차별점 강조 -->
  <rect x="50" y="480" width="1500" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="515" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">
    💡 핵심: 경쟁사는 "기존 비즈니스 모델 보호", FireNavi는 "새로운 시장 창출"
  </text>
  <text x="800" y="545" font-family="Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle">
    → 하드웨어 판매·프리미엄 전략·기업 솔루션에 갇히지 않은 자유로운 혁신
  </text>

  <!-- FireNavi 통합 아키텍처 -->
  <text x="50" y="610" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">
    FireNavi 온톨로지 기반 통합 아키텍처
  </text>

  <!-- 중앙 온톨로지 허브 -->
  <ellipse cx="800" cy="850" rx="220" ry="150" fill="url(#gradCore)" stroke="#1e40af" stroke-width="4" filter="url(#shadow2)"/>
  <text x="800" y="810" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
    재난대피 온톨로지
  </text>
  <text x="800" y="840" font-family="Arial, sans-serif" font-size="16" fill="#1e40af" text-anchor="middle">
    지식그래프 (RDF/OWL)
  </text>
  <text x="800" y="870" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">
    Person · Location · Hazard
  </text>
  <text x="800" y="895" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">
    Route · Sensor · Regulation
  </text>
  <text x="800" y="920" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">
    Responder · Decision · Instruction
  </text>

  <!-- 입력 레이어 (상단) -->
  <text x="50" y="660" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0c4a6e">
    입력 레이어 (5채널)
  </text>

  <!-- 채널 1: 음향 -->
  <rect x="50" y="680" width="260" height="90" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2" filter="url(#shadow2)"/>
  <text x="180" y="710" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
    1️⃣ 음향 자동 트리거
  </text>
  <text x="70" y="735" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">
    🔊 스마트폰 마이크 로컬 감지
  </text>
  <text x="70" y="755" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">
    → FireAlarmSound 노드 매핑
  </text>

  <!-- 채널 2: 측위 -->
  <rect x="340" y="680" width="260" height="90" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2" filter="url(#shadow2)"/>
  <text x="470" y="710" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle">
    2️⃣ 인프라프리 측위
  </text>
  <text x="360" y="735" font-family="Arial, sans-serif" font-size="11" fill="#7c2d12">
    📍 WiFi + IMU + 기압계
  </text>
  <text x="360" y="755" font-family="Arial, sans-serif" font-size="11" fill="#7c2d12">
    → "4층 복도" 온톨로지 노드
  </text>

  <!-- 채널 3: 설문 -->
  <rect x="630" y="680" width="260" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
  <text x="760" y="710" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">
