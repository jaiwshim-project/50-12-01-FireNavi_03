  </text>
  <text x="650" y="755" font-family="Arial, sans-serif" font-size="11" fill="#78350f">
    → 상태 온톨로지 노드 갱신
  </text>

  <!-- 채널 4: 센서 -->
  <rect x="920" y="680" width="260" height="90" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1050" y="710" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">
    4️⃣ 패시브 센서 융합
  </text>
  <text x="940" y="735" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">
    📊 조도·기압·IMU·마이크
  </text>
  <text x="940" y="755" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">
    → 위험 온톨로지 노드 갱신
  </text>

  <!-- 채널 5: 크라우드소싱 -->
  <rect x="1210" y="680" width="340" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1380" y="710" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e" text-anchor="middle">
    5️⃣ 인간보고 정규화
  </text>
  <text x="1230" y="735" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
    🗣️ "연기 냄새" → SmokeOdor 노드
  </text>
  <text x="1230" y="755" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
    → 베이지안 융합 신뢰도 평가
  </text>

  <!-- 입력 → 온톨로지 연결선 -->
  <path d="M 180 770 L 650 800" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 470 770 L 700 800" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 760 770 L 800 800" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 1050 770 L 900 800" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 1380 770 L 950 800" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>

  <!-- AI 엔진 레이어 -->
  <text x="50" y="1050" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0c4a6e">
    AI 엔진 레이어 (삼중 동기화)
  </text>

  <!-- Prediction Engine -->
  <rect x="200" y="1070" width="300" height="100" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2" filter="url(#shadow2)"/>
  <text x="350" y="1100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
    Prediction Engine
  </text>
  <text x="220" y="1125" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
    화재·연기 확산 예측
  </text>
  <text x="220" y="1145" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
    → FireSpreadZone 노드 갱신
  </text>

  <!-- Behavior Engine -->
  <rect x="650" y="1070" width="300" height="100" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2" filter="url(#shadow2)"/>
  <text x="800" y="1100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">
    Behavior Engine
  </text>
  <text x="670" y="1125" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">
    군중 행동·병목 예측
  </text>
  <text x="670" y="1145" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12">
    → Bottleneck 노드 갱신
  </text>

  <!-- Decision Engine -->
  <rect x="1100" y="1070" width="300" height="100" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1250" y="1100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">
    Decision Engine
  </text>
  <text x="1120" y="1125" font-family="Arial, sans-serif" font-size="12" fill="#14532d">
    개인별 경로 결정
  </text>
  <text x="1120" y="1145" font-family="Arial, sans-serif" font-size="12" fill="#14532d">
    → Route 추천 + 사유 생성
  </text>

  <!-- 온톨로지 ↔ 엔진 양방향 -->
  <path d="M 650 900 L 400 1070" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 750 900 L 800 1070" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 950 900 L 1200 1070" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,5"/>

  <!-- 출력 레이어 -->
  <text x="50" y="1230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0c4a6e">
    출력 레이어 (3채널 + 설명 가능성)
  </text>

  <!-- 사용자 앱 -->
  <rect x="50" y="1250" width="450" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" filter="url(#shadow2)"/>
  <text x="275" y="1285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">
    📱 사용자 앱 (개인별 맞춤)
  </text>
  <text x="70" y="1315" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">
    • 주경로 + 대체경로 (실시간 갱신)
  </text>
  <text x="70" y="1340" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">
    • 다국어 안내 (30개 언어)
  </text>
  <text x="70" y="1365" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">
    • ✨ 설명 가능한 추천 사유 생성
  </text>

  <!-- 관제센터 -->
  <rect x="575" y="1250" width="450" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow2)"/>
  <text x="800" y="1285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">
    🎛️ 관제센터 (전체 상황)
  </text>
  <text x="595" y="1315" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • 4채널 화재맵 (화재·연기·군중·출구)
  </text>
  <text x="595" y="1340" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • 취약계층 위치 + 구조 우선순위
  </text>
  <text x="595" y="1365" font-family="Arial, sans-serif" font-size="12" fill="#78350f">
    • ✨ AI 판단 근거 설명 제공
  </text>

  <!-- 구조대 -->
  <rect x="1100" y="1250" width="450" height="140" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow2)"/>
  <text x="1325" y="1285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">
    🚒 구조대 (구조 자원 배분)
  </text>
  <text x="1120" y="1315" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
    • 미응답자·낙상자 위치
  </text>
  <text x="1120" y="1340" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
    • 취약계층 우선순위 + 접근 경로
  </text>
  <text x="1120" y="1365" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
    • ✨ 온톨로지 기반 구조 전략 제공
  </text>

  <!-- 엔진 → 출력 연결 -->
  <path d="M 350 1170 L 275 1250" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowblue2)"/>
  <path d="M 800 1170 L 800 1250" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowblue2)"/>
  <path d="M 1250 1170 L 1325 1250" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowblue2)"/>

  <!-- 차별화 전략 요약 -->
  <rect x="50" y="1450" width="1500" height="500" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" filter="url(#shadow2)"/>
  <text x="800" y="1490" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#14532d" text-anchor="middle">
    🎯 경쟁사 대비 FireNavi 차별화 전략 (특허 청구 방향)
  </text>

  <!-- 전략 1 -->
  <text x="80" y="1540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">
    전략 1: 비즈니스 모델 차별화
  </text>
  <text x="100" y="1565" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
    • 하드웨어 판매 의존 없음 → 소프트웨어 구독 모델 ($4.99/월)
  </text>
  <text x="100" y="1585" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
    • 신규 인프라 설치 불필요 → 기존 스마트폰·WiFi 활용
  </text>
  <text x="100" y="1605" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
    • B2C + B2B 동시 공략 → 개인 사용자 + 공연장·병원·학교 라이선스
  </text>

  <!-- 전략 2 -->
  <text x="80" y="1650" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">
    전략 2: 기술 패러다임 차별화 (온톨로지 기반)
  </text>
  <text x="100" y="1675" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
    • 데이터 처리 → 의미 이해 (온톨로지 지식그래프)
  </text>
  <text x="100" y="1695" font-family="Arial, sans-serif" font-size="12" fill="#15803d">
    • 좌표 → 대피 의미 공간 ("4층 복도" → 계단 A 연결 → 연기 위험)
  </text>
