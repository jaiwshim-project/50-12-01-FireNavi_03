<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600">
  <!-- 도 10. 역할별 UI 화면 구성도 -->

  <!-- 제목 -->
  <text x="500" y="40" text-anchor="middle" font-family="Malgun Gothic" font-size="28" font-weight="bold" fill="black">
    도 10. 역할별 UI 화면 구성도
  </text>

  <!-- 일반 사용자 UI (310) -->
  <rect x="50" y="80" width="450" height="300" fill="none" stroke="black" stroke-width="3"/>
  <text x="275" y="110" text-anchor="middle" font-family="Malgun Gothic" font-size="16" font-weight="bold">
    일반 사용자 UI (310)
  </text>

  <!-- UI 헤더 -->
  <rect x="70" y="130" width="410" height="30" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="85" y="150" font-family="Malgun Gothic" font-size="12" font-weight="bold">FireNavi - 내 대피 경로</text>
  <text x="420" y="150" font-family="Malgun Gothic" font-size="10">[오프라인 모드]</text>

  <!-- 현재 위치 -->
  <text x="85" y="180" font-family="Malgun Gothic" font-size="11">현재 위치: 3층 A복도</text>
  <text x="85" y="198" font-family="Malgun Gothic" font-size="11">주경로: 좌측 비상구 → 3층 데크</text>
  <text x="85" y="216" font-family="Malgun Gothic" font-size="11">거리: 45m / 예상 시간: 2분</text>

  <!-- 미니 지도 -->
  <rect x="85" y="230" width="180" height="90" fill="none" stroke="black" stroke-width="1"/>
  <text x="100" y="250" font-family="Malgun Gothic" font-size="10">YOU ←</text>
  <line x1="120" y1="255" x2="120" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="140" y="270" font-family="Malgun Gothic" font-size="12">🔥</text>
  <line x1="120" y1="290" x2="85" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="90" y="305" font-family="Malgun Gothic" font-size="10">EXIT 🚪</text>

  <!-- 추천 이유 -->
  <text x="85" y="345" font-family="Malgun Gothic" font-size="10">추천 이유: "우측 비상구는 혼잡도가</text>
  <text x="85" y="360" font-family="Malgun Gothic" font-size="10">높아 좌측 경로 추천"</text>

  <!-- 승무원 UI (320) -->
  <rect x="520" y="80" width="450" height="300" fill="none" stroke="black" stroke-width="3"/>
  <text x="745" y="110" text-anchor="middle" font-family="Malgun Gothic" font-size="16" font-weight="bold">
    승무원 UI (320)
  </text>

  <!-- UI 헤더 -->
  <rect x="540" y="130" width="410" height="30" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="555" y="150" font-family="Malgun Gothic" font-size="12" font-weight="bold">FireNavi - 3층 A구역 상황</text>
  <text x="880" y="150" font-family="Malgun Gothic" font-size="10">[승무원]</text>

  <!-- 구역 정보 -->
  <text x="555" y="180" font-family="Malgun Gothic" font-size="11">담당 구역: 3층 A복도~D복도</text>
  <text x="555" y="198" font-family="Malgun Gothic" font-size="11">구역 내 인원: 42명</text>
  <text x="555" y="216" font-family="Malgun Gothic" font-size="11">대피 완료: 28명 / 대피 중: 12명 / 미응답: 2명</text>

  <!-- 취약계층 -->
  <text x="555" y="240" font-family="Malgun Gothic" font-size="11" font-weight="bold">⚠️ 취약계층 현황:</text>
  <text x="570" y="258" font-family="Malgun Gothic" font-size="10">• 휠체어 사용자 1명 (3A-205호)</text>
  <text x="570" y="274" font-family="Malgun Gothic" font-size="10">• 어린이 3명 (3A-210호, 보호자 동반)</text>

  <!-- 미응답자 -->
  <text x="555" y="298" font-family="Malgun Gothic" font-size="11" font-weight="bold">🔴 미응답자:</text>
  <text x="570" y="316" font-family="Malgun Gothic" font-size="10">• 김철수 (3A-220호) - 마지막 신호 5분 전</text>
  <text x="570" y="332" font-family="Malgun Gothic" font-size="10">• 이영희 (3A-225호) - 마지막 신호 3분 전</text>

  <text x="555" y="360" font-family="Malgun Gothic" font-size="10">[경로 수동 변경]  [관제센터 보고]</text>

  <!-- 관제센터 UI (330) -->
  <rect x="50" y="420" width="450" height="320" fill="none" stroke="black" stroke-width="3"/>
  <text x="275" y="450" text-anchor="middle" font-family="Malgun Gothic" font-size="16" font-weight="bold">
    관제센터 UI (330)
  </text>

  <!-- UI 헤더 -->
  <rect x="70" y="470" width="410" height="30" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="85" y="490" font-family="Malgun Gothic" font-size="12" font-weight="bold">FireNavi - 전체 상황 대시보드</text>
  <text x="400" y="490" font-family="Malgun Gothic" font-size="10">[관제센터]</text>

  <!-- 전체 인원 -->
  <text x="85" y="520" font-family="Malgun Gothic" font-size="11">전체 인원: 523명</text>
  <text x="85" y="538" font-family="Malgun Gothic" font-size="11">안전: 312명 / 대피중: 189명 / 미응답: 22명</text>

  <!-- 위험지도 -->
  <text x="85" y="562" font-family="Malgun Gothic" font-size="11" font-weight="bold">[전체 위험지도]</text>
  <rect x="85" y="572" width="250" height="70" fill="none" stroke="black" stroke-width="1"/>
  <text x="100" y="592" font-family="Malgun Gothic" font-size="10">3F: 🔥🔥 (화재 발생)</text>
  <text x="100" y="612" font-family="Malgun Gothic" font-size="10">4F: ⚠️ (연기 확산 중)</text>
  <text x="100" y="632" font-family="Malgun Gothic" font-size="10">5F: ✅ (안전)</text>

  <!-- 구조 우선순위 -->
  <text x="85" y="666" font-family="Malgun Gothic" font-size="11" font-weight="bold">🚨 구조 우선순위:</text>
  <text x="100" y="684" font-family="Malgun Gothic" font-size="10">1. 부상자 (3F-A복도) - 구조대 출동 중</text>
  <text x="100" y="700" font-family="Malgun Gothic" font-size="10">2. 미응답자 22명 - 승무원 확인 중</text>
  <text x="100" y="716" font-family="Malgun Gothic" font-size="10">3. 휠체어 사용자 5명 - 피난구역 대기</text>

  <!-- 구조대 UI (340) -->
  <rect x="520" y="420" width="450" height="320" fill="none" stroke="black" stroke-width="3"/>
  <text x="745" y="450" text-anchor="middle" font-family="Malgun Gothic" font-size="16" font-weight="bold">
    구조대 UI (340)
  </text>

  <!-- UI 헤더 -->
  <rect x="540" y="470" width="410" height="30" fill="#f0f0f0" stroke="black" stroke-width="1"/>
  <text x="555" y="490" font-family="Malgun Gothic" font-size="12" font-weight="bold">FireNavi - 구조 대상자 정보</text>
  <text x="880" y="490" font-family="Malgun Gothic" font-size="10">[구조대]</text>

  <!-- 대상자 정보 -->
  <text x="555" y="520" font-family="Malgun Gothic" font-size="11" font-weight="bold">우선순위 1위: 부상자 (3F-A복도-215호)</text>
  <text x="555" y="538" font-family="Malgun Gothic" font-size="10">위치: 3층 A복도 객실 215호</text>
  <text x="555" y="554" font-family="Malgun Gothic" font-size="10">상태: 낙상 감지, 미응답</text>
  <text x="555" y="570" font-family="Malgun Gothic" font-size="10">마지막 신호: 8분 전</text>

  <!-- 접근 경로 -->
  <text x="555" y="594" font-family="Malgun Gothic" font-size="11" font-weight="bold">[접근 경로]</text>
  <rect x="555" y="604" width="180" height="90" fill="none" stroke="black" stroke-width="1"/>
  <text x="570" y="624" font-family="Malgun Gothic" font-size="10">구조대 현재 위치</text>
  <line x1="645" y1="628" x2="645" y2="650" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="570" y="654" font-family="Malgun Gothic" font-size="10">2F 계단 (안전)</text>
  <line x1="645" y1="658" x2="645" y2="672" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="570" y="676" font-family="Malgun Gothic" font-size="10">3F A복도 (⚠️)</text>
  <line x1="645" y1="680" x2="645" y2="688" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="570" y="692" font-family="Malgun Gothic" font-size="10">🚨 215호</text>

  <!-- 필요 장비 -->
  <text x="755" y="624" font-family="Malgun Gothic" font-size="11" font-weight="bold">필요 장비:</text>
  <text x="770" y="642" font-family="Malgun Gothic" font-size="10">• 들것</text>
  <text x="770" y="658" font-family="Malgun Gothic" font-size="10">• 산소 호흡기</text>
  <text x="770" y="674" font-family="Malgun Gothic" font-size="10">• 방화복 (연기 위험)</text>

  <text x="555" y="715" font-family="Malgun Gothic" font-size="10">[구조 시작]  [다음 대상자]</text>

  <!-- 부호 설명 박스 -->
  <rect x="50" y="800" width="900" height="180" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="500" y="830" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    부호 설명
  </text>

  <text x="70" y="860" font-family="Malgun Gothic" font-size="12">(310): 일반 사용자 UI</text>
  <text x="70" y="885" font-family="Malgun Gothic" font-size="12">       - 현재 위치, 주경로, 거리, 예상 시간, 지도, 추천 이유 표시</text>
  <text x="70" y="910" font-family="Malgun Gothic" font-size="12">       - 경로 시작, 대체경로 보기 기능</text>

  <text x="520" y="860" font-family="Malgun Gothic" font-size="12">(320): 승무원 UI</text>
  <text x="520" y="885" font-family="Malgun Gothic" font-size="12">       - 담당 구역 인원, 취약계층, 미응답자 관리</text>
  <text x="520" y="910" font-family="Malgun Gothic" font-size="12">       - 경로 수동 변경, 관제센터 보고 기능</text>

  <text x="70" y="940" font-family="Malgun Gothic" font-size="12">(330): 관제센터 UI</text>
  <text x="70" y="965" font-family="Malgun Gothic" font-size="12">       - 전체 인원, 위험지도, 구조 우선순위 관리</text>

  <text x="520" y="940" font-family="Malgun Gothic" font-size="12">(340): 구조대 UI</text>
  <text x="520" y="965" font-family="Malgun Gothic" font-size="12">       - 구조 대상자 정보, 접근 경로, 필요 장비</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
