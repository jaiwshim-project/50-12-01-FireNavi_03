<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400">
  <!-- 도 9. 대피 그룹 관리 흐름도 -->

  <!-- 제목 -->
  <text x="450" y="40" text-anchor="middle" font-family="Malgun Gothic" font-size="28" font-weight="bold" fill="black">
    도 9. 대피 그룹 관리 흐름도
  </text>

  <!-- 시작: 사용자 등록 정보 -->
  <rect x="325" y="80" width="250" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="450" y="110" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    사용자 등록 정보
  </text>

  <!-- 화살표 1 -->
  <line x1="450" y1="130" x2="450" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S410: 그룹 편성 조건 확인 -->
  <rect x="200" y="170" width="500" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="195" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S410: 그룹 편성 조건 확인
  </text>
  <text x="220" y="220" font-family="Malgun Gothic" font-size="12">• 동일 객실 체크인?</text>
  <text x="220" y="240" font-family="Malgun Gothic" font-size="12">• 보호자-피보호자 관계?</text>
  <text x="500" y="220" font-family="Malgun Gothic" font-size="12">• 교직원-학생 관계?</text>
  <text x="500" y="240" font-family="Malgun Gothic" font-size="12">• 승무원 수동 편성?</text>
  <text x="710" y="220" text-anchor="start" font-family="Consolas" font-size="12">(260)</text>

  <!-- 화살표 2 -->
  <line x1="450" y1="270" x2="450" y2="310" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S420: 대피 그룹 생성 -->
  <rect x="250" y="310" width="400" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="335" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S420: 대피 그룹 생성
  </text>
  <text x="270" y="358" font-family="Malgun Gothic" font-size="12">Group ID 발급</text>
  <text x="270" y="376" font-family="Malgun Gothic" font-size="12">그룹 멤버 목록 생성</text>
  <text x="500" y="358" font-family="Malgun Gothic" font-size="12">그룹장 지정</text>
  <text x="500" y="376" font-family="Malgun Gothic" font-size="12">(보호자 우선)</text>

  <!-- 화살표 3 -->
  <line x1="450" y1="390" x2="450" y2="430" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S430: 그룹 내 최대 취약도 추출 -->
  <rect x="150" y="430" width="600" height="120" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S430: 그룹 내 최대 취약도 추출
  </text>
  <text x="170" y="478" font-family="Malgun Gothic" font-size="11">FOR EACH 멤버 IN 그룹:</text>
  <text x="190" y="498" font-family="Malgun Gothic" font-size="11">IF 멤버 = 휠체어 사용자 THEN</text>
  <text x="210" y="516" font-family="Malgun Gothic" font-size="11">→ 그룹 제약 = 계단 사용 불가</text>
  <text x="470" y="498" font-family="Malgun Gothic" font-size="11">IF 멤버 = 호흡기 환자 THEN</text>
  <text x="490" y="516" font-family="Malgun Gothic" font-size="11">→ 그룹 연기 가중치 = 3.0</text>
  <text x="190" y="538" font-family="Malgun Gothic" font-size="11">IF 멤버 = 어린이 THEN</text>
  <text x="210" y="556" font-family="Malgun Gothic" font-size="11">→ 그룹 이동 속도 = 최소값</text>

  <!-- 화살표 4 -->
  <line x1="450" y1="550" x2="450" y2="600" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S440: 그룹 전체 경로 비용 함수 조정 -->
  <rect x="200" y="600" width="500" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="625" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S440: 그룹 전체 경로 비용 함수 조정
  </text>
  <text x="220" y="650" font-family="Consolas" font-size="13">Cost_group(u,v) = Cost_base(u,v) × MAX(W_member)</text>
  <text x="450" y="680" text-anchor="middle" font-family="Malgun Gothic" font-size="12">
    모든 그룹 멤버가 동일한 경로 할당됨
  </text>

  <!-- 화살표 5 -->
  <line x1="450" y1="700" x2="450" y2="740" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S450: 그룹 응집성 모니터링 -->
  <rect x="200" y="740" width="500" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="765" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S450: 그룹 응집성 모니터링
  </text>
  <text x="220" y="790" font-family="Malgun Gothic" font-size="12">IF Distance(멤버A, 멤버B) &gt; 20m THEN</text>
  <text x="240" y="810" font-family="Malgun Gothic" font-size="12">• 경고 메시지 발송: "그룹에서 이탈 중입니다"</text>
  <text x="240" y="828" font-family="Malgun Gothic" font-size="12">• 대체경로 재계산</text>

  <!-- 화살표 6 -->
  <line x1="450" y1="840" x2="450" y2="880" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S460: 그룹 해산 조건 -->
  <rect x="250" y="880" width="400" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="905" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S460: 그룹 해산 조건
  </text>
  <text x="270" y="928" font-family="Malgun Gothic" font-size="12">• 모든 멤버가 안전구역 도착</text>
  <text x="270" y="946" font-family="Malgun Gothic" font-size="12">• 그룹장이 수동 해산</text>
  <text x="500" y="928" font-family="Malgun Gothic" font-size="12">• 승무원이 강제 해산</text>

  <!-- 화살표 7 -->
  <line x1="450" y1="960" x2="450" y2="1000" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 종료: 그룹 대피 완료 -->
  <rect x="325" y="1000" width="250" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="450" y="1030" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    그룹 대피 완료
  </text>

  <!-- 부호 설명 박스 -->
  <rect x="50" y="1100" width="800" height="240" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="450" y="1130" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    부호 설명
  </text>

  <text x="70" y="1160" font-family="Malgun Gothic" font-size="12">(260): 그룹 관리부 (도 1 참조)</text>
  <text x="70" y="1185" font-family="Malgun Gothic" font-size="12">S410: 그룹 편성 조건 확인 (동일 객실/보호자 관계/교직원-학생)</text>
  <text x="70" y="1210" font-family="Malgun Gothic" font-size="12">S420: 대피 그룹 생성 (Group ID 발급, 멤버 목록, 그룹장 지정)</text>
  <text x="70" y="1235" font-family="Malgun Gothic" font-size="12">S430: 그룹 내 최대 취약도 추출 (휠체어/호흡기/어린이 제약)</text>
  <text x="70" y="1260" font-family="Malgun Gothic" font-size="12">S440: 그룹 전체 경로 비용 함수 조정 (동일 경로 할당)</text>
  <text x="70" y="1285" font-family="Malgun Gothic" font-size="12">S450: 그룹 응집성 모니터링 (거리 20m 초과 시 경고)</text>
  <text x="70" y="1310" font-family="Malgun Gothic" font-size="12">S460: 그룹 해산 조건 (안전구역 도착/수동 해산/강제 해산)</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
