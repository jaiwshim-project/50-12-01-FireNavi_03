<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1900">
  <!-- 도 4. 위험지도 생성 및 동적 갱신 흐름도 (v2 - Patent Standard) -->

  <!-- 제목 -->
  <text x="500" y="40" text-anchor="middle" font-family="Malgun Gothic" font-size="28" font-weight="bold" fill="black">
    도 4. 위험지도 생성 및 동적 갱신 흐름도
  </text>

  <!-- 시작: 입력 신호원 -->
  <rect x="375" y="80" width="250" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="500" y="110" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    입력 신호원
  </text>

  <!-- 화살표 1 -->
  <line x1="500" y1="130" x2="500" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 3개 입력원 병렬 -->
  <rect x="100" y="170" width="200" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-family="Malgun Gothic" font-size="13" font-weight="bold">
    스마트폰 센서
  </text>
  <text x="200" y="230" text-anchor="middle" font-family="Malgun Gothic" font-size="12">
    S210
  </text>

  <rect x="350" y="170" width="300" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" font-family="Malgun Gothic" font-size="13" font-weight="bold">
    사용자 보고
  </text>
  <text x="500" y="230" text-anchor="middle" font-family="Malgun Gothic" font-size="12">
    S220
  </text>

  <rect x="700" y="170" width="200" height="100" fill="none" stroke="black" stroke-width="2"/>
  <text x="800" y="195" text-anchor="middle" font-family="Malgun Gothic" font-size="13" font-weight="bold">
    설비 신호
  </text>
  <text x="800" y="230" text-anchor="middle" font-family="Malgun Gothic" font-size="12">
    S230
  </text>

  <!-- 화살표: 3개 입력원 → S240 -->
  <line x1="200" y1="270" x2="200" y2="300" stroke="black" stroke-width="1"/>
  <line x1="500" y1="270" x2="500" y2="300" stroke="black" stroke-width="1"/>
  <line x1="800" y1="270" x2="800" y2="300" stroke="black" stroke-width="1"/>
  <line x1="200" y1="300" x2="800" y2="300" stroke="black" stroke-width="1"/>
  <line x1="500" y1="300" x2="500" y2="340" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S240: 입력원별 신뢰도 가중치 적용 -->
  <rect x="150" y="340" width="700" height="140" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="365" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S240: 입력원별 신뢰도 가중치 적용
  </text>
  <text x="170" y="395" font-family="Malgun Gothic" font-size="12">• 설비 신호: 가중치 0.9 (가장 신뢰도 높음)</text>
  <text x="170" y="420" font-family="Malgun Gothic" font-size="12">• 사용자 보고: 가중치 0.7 (중간 신뢰도)</text>
  <text x="170" y="445" font-family="Malgun Gothic" font-size="12">• 스마트폰 센서: 가중치 0.6 (기본 신뢰도)</text>
  <text x="170" y="470" font-family="Malgun Gothic" font-size="11" font-weight="bold">→ 신뢰도 점수 산출부 (220)</text>

  <!-- 화살표 3 -->
  <line x1="500" y1="480" x2="500" y2="520" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S250: 시간-공간 기반 융합 -->
  <rect x="150" y="520" width="700" height="180" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="545" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S250: 시간-공간 기반 융합
  </text>
  <text x="170" y="575" font-family="Malgun Gothic" font-size="12">1. 동일 구역 내 신호 집계</text>
  <text x="190" y="595" font-family="Malgun Gothic" font-size="11">   - 공간 온톨로지 (212) 기반 구역 분류</text>
  <text x="190" y="612" font-family="Malgun Gothic" font-size="11">   - 동일 구역 내 n ≥ 2 신호 → 신뢰도 +20%</text>
  <text x="170" y="635" font-family="Malgun Gothic" font-size="12">2. 시간 윈도우 내 신호 통합 (30초 윈도우)</text>
  <text x="170" y="658" font-family="Malgun Gothic" font-size="12">3. 확산 패턴 예측</text>
  <text x="190" y="678" font-family="Malgun Gothic" font-size="11">   - 위험 온톨로지 (213) 기반 확산 방향 추정</text>

  <!-- 화살표 4 -->
  <line x1="500" y1="700" x2="500" y2="740" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S260: 동적 위험지도 생성 -->
  <rect x="150" y="740" width="700" height="180" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="765" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S260: 동적 위험지도 생성
  </text>
  <text x="170" y="795" font-family="Malgun Gothic" font-size="12">위험도 레벨 (0~10):</text>
  <text x="190" y="820" font-family="Malgun Gothic" font-size="12">• 0~2: 안전 (녹색)</text>
  <text x="190" y="843" font-family="Malgun Gothic" font-size="12">• 3~5: 주의 (노란색)</text>
  <text x="190" y="866" font-family="Malgun Gothic" font-size="12">• 6~8: 위험 (주황색)</text>
  <text x="190" y="889" font-family="Malgun Gothic" font-size="12">• 9~10: 매우 위험 (빨간색)</text>
  <text x="170" y="910" font-family="Malgun Gothic" font-size="11" font-weight="bold">→ 위험지도 생성부 (230)</text>

  <!-- 화살표 5 -->
  <line x1="500" y1="920" x2="500" y2="960" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S270: 위험지도 갱신 주기 -->
  <rect x="150" y="960" width="700" height="160" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="985" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S270: 위험지도 갱신 주기
  </text>
  <text x="190" y="1015" font-family="Malgun Gothic" font-size="12">• 주의 모드: 10초 주기 갱신</text>
  <text x="190" y="1040" font-family="Malgun Gothic" font-size="12">• 확인 모드: 5초 주기 갱신</text>
  <text x="190" y="1065" font-family="Malgun Gothic" font-size="12">• 대피 모드: 2초 주기 갱신</text>
  <text x="190" y="1090" font-family="Malgun Gothic" font-size="12">• 구조 모드: 1초 주기 갱신 (실시간)</text>

  <!-- 화살표 6 -->
  <line x1="500" y1="1120" x2="500" y2="1160" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 종료: 경로 추천부로 전달 -->
  <rect x="325" y="1160" width="350" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="500" y="1190" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    경로 추천부로 전달
  </text>

  <!-- 부호 설명 박스 -->
  <rect x="100" y="1270" width="800" height="220" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="500" y="1300" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    부호 설명
  </text>

  <text x="120" y="1330" font-family="Malgun Gothic" font-size="12">S210: 스마트폰 센서 신호 수집</text>
  <text x="120" y="1355" font-family="Malgun Gothic" font-size="12">S220: 사용자 보고 수집</text>
  <text x="120" y="1380" font-family="Malgun Gothic" font-size="12">S230: 설비 신호 수집</text>
  <text x="120" y="1405" font-family="Malgun Gothic" font-size="12">S240: 입력원별 신뢰도 가중치 적용 (신뢰도 점수 산출부 220)</text>
  <text x="120" y="1430" font-family="Malgun Gothic" font-size="12">S250: 시간-공간 기반 융합 (공간 온톨로지 212, 위험 온톨로지 213)</text>
  <text x="120" y="1455" font-family="Malgun Gothic" font-size="12">S260: 동적 위험지도 생성 (위험지도 생성부 230)</text>
  <text x="120" y="1480" font-family="Malgun Gothic" font-size="12">S270: 위험지도 갱신 주기 설정 (모드별 차등 갱신)</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
