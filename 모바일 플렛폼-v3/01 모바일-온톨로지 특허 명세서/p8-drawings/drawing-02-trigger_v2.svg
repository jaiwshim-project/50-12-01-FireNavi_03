<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2200">
  <!-- 도 2. 다중 외부 자극 수집 및 신뢰도 점수 산출 흐름도 (v2 - Patent Standard) -->

  <!-- 제목 -->
  <text x="500" y="40" text-anchor="middle" font-family="Malgun Gothic" font-size="28" font-weight="bold" fill="black">
    도 2. 다중 외부 자극 수집 및 신뢰도 점수 산출 흐름도
  </text>

  <!-- 시작: 사용자 단말 센서 -->
  <rect x="375" y="80" width="250" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="500" y="110" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    사용자 단말 센서
  </text>

  <!-- 화살표 1 -->
  <line x1="500" y1="130" x2="500" y2="170" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S110: 12종 외부 자극 수집 -->
  <rect x="100" y="170" width="800" height="320" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S110: 12종 외부 자극 수집
  </text>

  <text x="120" y="225" font-family="Malgun Gothic" font-size="12">• 화재경보음 (마이크)</text>
  <text x="120" y="245" font-family="Malgun Gothic" font-size="12">• 비상 음성 키워드 ("불", "도와줘")</text>
  <text x="120" y="265" font-family="Malgun Gothic" font-size="12">• 비명/폭발음 (음성 분석)</text>
  <text x="120" y="285" font-family="Malgun Gothic" font-size="12">• 급진동 (가속도계)</text>
  <text x="120" y="305" font-family="Malgun Gothic" font-size="12">• 낙상 (급격한 가속도 변화)</text>
  <text x="120" y="325" font-family="Malgun Gothic" font-size="12">• 조도 급감 (조도센서)</text>

  <text x="520" y="225" font-family="Malgun Gothic" font-size="12">• WiFi 신호 이상</text>
  <text x="520" y="245" font-family="Malgun Gothic" font-size="12">• BLE 신호 이상</text>
  <text x="520" y="265" font-family="Malgun Gothic" font-size="12">• 사용자 SOS 신고</text>
  <text x="520" y="285" font-family="Malgun Gothic" font-size="12">• 미응답 (10분 이상 무이동)</text>
  <text x="520" y="305" font-family="Malgun Gothic" font-size="12">• 선박 설비 신호 (화재감지기, 연기감지기)</text>
  <text x="520" y="325" font-family="Malgun Gothic" font-size="12">• 관제센터 비상 푸시</text>

  <text x="120" y="360" font-family="Malgun Gothic" font-size="11" font-weight="bold">외부 자극 수집부 (110)</text>

  <!-- 화살표 2 -->
  <line x1="500" y1="490" x2="500" y2="530" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S120: 재난 이벤트 온톨로지 매핑 -->
  <rect x="150" y="530" width="700" height="200" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="555" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S120: 재난 이벤트 온톨로지 매핑
  </text>

  <text x="170" y="585" font-family="Malgun Gothic" font-size="12">의미 노드 변환:</text>
  <text x="190" y="610" font-family="Malgun Gothic" font-size="12">• Fire (화재) ← 화재경보음, 연기감지기, 화재감지기</text>
  <text x="190" y="630" font-family="Malgun Gothic" font-size="12">• Smoke (연기) ← 조도 급감, 연기감지기, 사용자 보고</text>
  <text x="190" y="650" font-family="Malgun Gothic" font-size="12">• Congestion (혼잡) ← 다수 단말 동일 위치, 이동 속도 저하</text>
  <text x="190" y="670" font-family="Malgun Gothic" font-size="12">• ExitClosure (출구 폐쇄) ← 방화문 센서, 사용자 보고</text>
  <text x="190" y="690" font-family="Malgun Gothic" font-size="12">• PowerFailure (정전) ← 조도 급감, WiFi 신호 이상</text>

  <text x="170" y="710" font-family="Malgun Gothic" font-size="11" font-weight="bold">온톨로지 관리부 (210)</text>

  <!-- 화살표 3 -->
  <line x1="500" y1="730" x2="500" y2="770" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S130: 신뢰도 점수 산출 -->
  <rect x="150" y="770" width="700" height="240" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="795" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S130: 신뢰도 점수 산출
  </text>

  <text x="170" y="825" font-family="Malgun Gothic" font-size="12">신뢰도 점수 = ∑(신호 강도 × 가중치) × 보정 계수</text>

  <text x="170" y="855" font-family="Malgun Gothic" font-size="12">고려 요소:</text>
  <text x="190" y="880" font-family="Malgun Gothic" font-size="12">• 신호 강도 (0.0 ~ 1.0)</text>
  <text x="190" y="900" font-family="Malgun Gothic" font-size="12">• 동일 구역 발생 빈도 (n ≥ 2 → 신뢰도 +20%)</text>
  <text x="190" y="920" font-family="Malgun Gothic" font-size="12">• 시간적 연속성 (30초 이내 연속 신호 → +15%)</text>
  <text x="190" y="940" font-family="Malgun Gothic" font-size="12">• 공간적 근접성 (10m 이내 → +10%)</text>
  <text x="190" y="960" font-family="Malgun Gothic" font-size="12">• 다수 단말 일치성 (3대 이상 → +25%)</text>
  <text x="190" y="980" font-family="Malgun Gothic" font-size="12">• 설비 신호 교차 검증 (설비 신호 있음 → ×1.5)</text>

  <!-- 화살표 4 -->
  <line x1="500" y1="1010" x2="500" y2="1050" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- S140: 모드 결정 -->
  <rect x="150" y="1050" width="700" height="180" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="1075" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    S140: 모드 결정
  </text>

  <text x="190" y="1105" font-family="Malgun Gothic" font-size="12">• 주의 모드: 신뢰도 &lt; 40% (정보 수집 강화)</text>
  <text x="190" y="1130" font-family="Malgun Gothic" font-size="12">• 확인 모드: 40% ≤ 신뢰도 &lt; 70% (사용자 확인 요청)</text>
  <text x="190" y="1155" font-family="Malgun Gothic" font-size="12">• 대피 모드: 70% ≤ 신뢰도 &lt; 90% (대피 경로 제공)</text>
  <text x="190" y="1180" font-family="Malgun Gothic" font-size="12">• 구조 모드: 신뢰도 ≥ 90% (구조대 출동 + 강제 대피)</text>

  <!-- 화살표 5 -->
  <line x1="500" y1="1230" x2="500" y2="1270" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 종료: 위험지도 생성 및 경로 산출 -->
  <rect x="325" y="1270" width="350" height="50" fill="none" stroke="black" stroke-width="2" rx="10"/>
  <text x="500" y="1300" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    위험지도 생성 및 경로 산출
  </text>

  <!-- 부호 설명 박스 -->
  <rect x="100" y="1380" width="800" height="200" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="500" y="1410" text-anchor="middle" font-family="Malgun Gothic" font-size="14" font-weight="bold">
    부호 설명
  </text>

  <text x="120" y="1440" font-family="Malgun Gothic" font-size="12">S110: 12종 외부 자극 수집 단계 (외부 자극 수집부 110)</text>
  <text x="120" y="1465" font-family="Malgun Gothic" font-size="12">S120: 재난 이벤트 온톨로지 매핑 단계 (온톨로지 관리부 210)</text>
  <text x="120" y="1490" font-family="Malgun Gothic" font-size="12">S130: 신뢰도 점수 산출 단계 (신뢰도 점수 산출부 220)</text>
  <text x="120" y="1515" font-family="Malgun Gothic" font-size="12">S140: 모드 결정 단계 (신뢰도 점수 → 재난 대응 모드)</text>

  <text x="120" y="1550" font-family="Malgun Gothic" font-size="11" font-weight="bold">본 도면은 청구항 2 (12종 외부 자극)와 청구항 3 (신뢰도 점수 산출)을 구체적으로 나타낸다.</text>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black"/>
    </marker>
  </defs>
</svg>
