  <rect x="40" y="1017" width="1320" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="1036" font-size="11" fill="#64748B">Risk Formula · 위험 수식:</text>
