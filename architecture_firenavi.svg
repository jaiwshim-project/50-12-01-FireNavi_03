<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 32px; font-weight: bold; fill: #1F2937; }
      .subtitle { font-size: 16px; fill: #6B7280; }
      .label { font-size: 14px; font-weight: 600; fill: #1F2937; }
      .text { font-size: 13px; fill: #4B5563; }
      .text-white { font-size: 13px; fill: white; font-weight: 600; }
      .arrow { stroke: #9CA3AF; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .box { fill: #F3F4F6; stroke: #D1D5DB; stroke-width: 2; }
      .box-prediction { fill: #FEE2E2; stroke: #EF4444; stroke-width: 2; }
      .box-behavior { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 2; }
      .box-decision { fill: #EDE9FE; stroke: #7C3AED; stroke-width: 2; }
      .box-header { fill: #EF4444; }
      .box-header-blue { fill: #3B82F6; }
      .box-header-purple { fill: #7C3AED; }
      .box-header-green { fill: #10B981; }
      .line-dash { stroke: #9CA3AF; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="1400" fill="#FFFFFF"/>

  <!-- 제목 -->
  <text x="600" y="40" text-anchor="middle" class="title">FireNavi 기술 구조도</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">3개 AI 엔진 통합 아키텍처</text>

  <!-- ========== LAYER 1: 입력 계층 ========== -->
  <text x="50" y="110" class="label">📥 LAYER 1: 입력 계층 (Data Acquisition)</text>

  <!-- 입력 소스들 -->
  <rect x="50" y="130" width="180" height="100" rx="8" class="box"/>
  <text x="140" y="155" text-anchor="middle" class="label">🌡️ IoT 센서</text>
  <text x="140" y="175" text-anchor="middle" class="text">온도, CO</text>
  <text x="140" y="195" text-anchor="middle" class="text">연기 감지기</text>
  <text x="140" y="215" text-anchor="middle" class="text">500+ 대</text>

  <rect x="280" y="130" width="180" height="100" rx="8" class="box"/>
  <text x="370" y="155" text-anchor="middle" class="label">📍 WiFi 위치</text>
  <text x="370" y="175" text-anchor="middle" class="text">실시간 삼각측위</text>
  <text x="370" y="195" text-anchor="middle" class="text">2~3m 정밀도</text>
  <text x="370" y="215" text-anchor="middle" class="text">6,000명</text>

  <rect x="510" y="130" width="180" height="100" rx="8" class="box"/>
  <text x="600" y="155" text-anchor="middle" class="label">📹 CCTV</text>
  <text x="600" y="175" text-anchor="middle" class="text">화원 위치/크기</text>
  <text x="600" y="195" text-anchor="middle" class="text">영상 기반 추정</text>
  <text x="600" y="215" text-anchor="middle" class="text"></text>

  <rect x="740" y="130" width="180" height="100" rx="8" class="box"/>
  <text x="830" y="155" text-anchor="middle" class="label">🆔 프로필 카드</text>
  <text x="830" y="175" text-anchor="middle" class="text">건강 상태</text>
  <text x="830" y="195" text-anchor="middle" class="text">신체적 조건</text>
  <text x="830" y="215" text-anchor="middle" class="text">Priority Device</text>

  <!-- 화살표 아래 -->
  <line x1="140" y1="230" x2="140" y2="270" class="arrow"/>
  <line x1="370" y1="230" x2="370" y2="270" class="arrow"/>
  <line x1="600" y1="230" x2="600" y2="270" class="arrow"/>
  <line x1="830" y1="230" x2="830" y2="270" class="arrow"/>
  <line x1="50" y1="290" x2="950" y2="290" class="arrow"/>

  <!-- ========== LAYER 2: AI 처리 계층 ========== -->
  <text x="50" y="330" class="label">🤖 LAYER 2: AI 처리 계층 (3개 엔진 동시 가동)</text>

  <!-- Prediction AI -->
  <rect x="50" y="350" width="270" height="220" rx="8" class="box-prediction"/>
  <rect x="50" y="350" width="270" height="35" rx="8" class="box-header"/>
  <text x="185" y="377" text-anchor="middle" class="text-white" style="font-size: 16px;">🔴 Prediction AI</text>
  <text x="60" y="410" class="text" style="font-weight: 600;">미래를 보는 AI</text>

  <text x="60" y="435" class="text">• Navier-Stokes CFD</text>
  <text x="60" y="455" class="text">  유체역학 시뮬레이션</text>
  <text x="60" y="475" class="text">• Advection-Diffusion</text>
  <text x="60" y="495" class="text">  연기 이동 예측</text>
  <text x="60" y="515" class="text">• Beer-Lambert 법칙</text>
  <text x="60" y="535" class="text">  가시거리 계산</text>
  <text x="60" y="555" class="text">• LSTM 신경망</text>
  <text x="60" y="555" class="text" dx="150">실시간 예측</text>

  <!-- Behavior AI -->
  <rect x="380" y="350" width="270" height="220" rx="8" class="box-behavior"/>
  <rect x="380" y="350" width="270" height="35" rx="8" class="box-header-blue"/>
  <text x="515" y="377" text-anchor="middle" class="text-white" style="font-size: 16px;">🔵 Behavior AI</text>
  <text x="390" y="410" class="text" style="font-weight: 600;">사람을 이해하는 AI</text>

  <text x="390" y="435" class="text">• Social Force Model</text>
  <text x="390" y="455" class="text">  보행자 상호작용</text>
  <text x="390" y="475" class="text">• KDE (밀집도)</text>
  <text x="390" y="495" class="text">  실시간 열지도</text>
  <text x="390" y="515" class="text">• Greenshields</text>
  <text x="390" y="535" class="text">  밀집도→속도 변환</text>
  <text x="390" y="555" class="text">• Multi-Agent</text>
  <text x="390" y="555" class="text" dx="150">6가지 유형</text>

  <!-- Decision AI -->
  <rect x="710" y="350" width="270" height="220" rx="8" class="box-decision"/>
  <rect x="710" y="350" width="270" height="35" rx="8" class="box-header-purple"/>
  <text x="845" y="377" text-anchor="middle" class="text-white" style="font-size: 16px;">🟣 Decision AI</text>
  <text x="720" y="410" class="text" style="font-weight: 600;">결정을 내리는 AI</text>

  <text x="720" y="435" class="text">• Dynamic Risk Map</text>
  <text x="720" y="455" class="text">  4가지 위험 통합</text>
  <text x="720" y="475" class="text">• Safety-First A*</text>
  <text x="720" y="495" class="text">  위험 회피 경로</text>
  <text x="720" y="515" class="text">• Exit Balancing</text>
  <text x="720" y="535" class="text">  출구 최적 분산</text>
  <text x="720" y="555" class="text">• CBS</text>
  <text x="720" y="555" class="text" dx="150">충돌 해소</text>

  <!-- 출력 화살표 -->
  <line x1="185" y1="570" x2="185" y2="610" class="arrow"/>
  <line x1="515" y1="570" x2="515" y2="610" class="arrow"/>
  <line x1="845" y1="570" x2="845" y2="610" class="arrow"/>
  <line x1="50" y1="630" x2="980" y2="630" class="arrow"/>

  <!-- ========== LAYER 3: 통합 출력 ========== -->
  <text x="50" y="670" class="label">🎯 LAYER 3: 통합 출력 (Dynamic Risk Map)</text>

  <rect x="50" y="690" width="900" height="120" rx="8" class="box" style="fill: #F0FDF4; stroke: #10B981; stroke-width: 2;"/>
  <rect x="50" y="690" width="900" height="35" rx="8" class="box-header-green"/>
  <text x="500" y="717" text-anchor="middle" class="text-white" style="font-size: 16px;">Dynamic Risk Map (동적 위험지도)</text>

  <text x="60" y="745" class="text">R(x,y,t) = 0.35F(화재열) + 0.30S(연기밀도) + 0.20D(군중밀집도) + 0.15C(구조붕괴)</text>
  <text x="60" y="765" class="text">• 실시간 4가지 위험 요소 통합 합성</text>
  <text x="60" y="785" class="text">• 매 초 갱신 (60+ Hz)</text>
  <text x="60" y="795" class="text">• 시간 차원 포함 (t+60초 미래까지 반영)</text>

  <!-- 화살표 -->
  <line x1="500" y1="810" x2="500" y2="850" class="arrow"/>

  <!-- ========== LAYER 4: 제어 계층 ========== -->
  <text x="50" y="890" class="label">⚙️ LAYER 4: 제어 계층 (경로 계산)</text>

  <rect x="50" y="910" width="210" height="120" rx="8" class="box"/>
  <text x="155" y="930" text-anchor="middle" class="label">6,000명</text>
  <text x="155" y="950" text-anchor="middle" class="label">개별 경로</text>
  <text x="155" y="975" text-anchor="middle" class="text">• 일반인: 최단거리</text>
  <text x="155" y="995" text-anchor="middle" class="text">• 고령자: 엘리베이터</text>
  <text x="155" y="1015" text-anchor="middle" class="text">• 휠체어: 경사로</text>

  <rect x="320" y="910" width="210" height="120" rx="8" class="box"/>
  <text x="425" y="930" text-anchor="middle" class="label">출구 분산</text>
  <text x="425" y="950" text-anchor="middle" class="label">최적화</text>
  <text x="425" y="975" text-anchor="middle" class="text">• Exit Balancing</text>
  <text x="425" y="995" text-anchor="middle" class="text">• 혼잡도 패널티</text>
  <text x="425" y="1015" text-anchor="middle" class="text">• 동적 재배정</text>

  <rect x="590" y="910" width="210" height="120" rx="8" class="box"/>
  <text x="695" y="930" text-anchor="middle" class="label">충돌 해소</text>
  <text x="695" y="950" text-anchor="middle" class="label">(CBS)</text>
  <text x="695" y="975" text-anchor="middle" class="text">• 6,000명 경로</text>
  <text x="695" y="995" text-anchor="middle" class="text">• 교차점 분석</text>
  <text x="695" y="1015" text-anchor="middle" class="text">• 100% 회피</text>

  <rect x="860" y="910" width="90" height="120" rx="8" class="box"/>
  <text x="905" y="930" text-anchor="middle" class="label">소방관</text>
  <text x="905" y="950" text-anchor="middle" class="label">배치</text>
  <text x="905" y="975" text-anchor="middle" class="text">• 최적 위치</text>
  <text x="905" y="995" text-anchor="middle" class="text">• 진입 경로</text>
  <text x="905" y="1015" text-anchor="middle" class="text">• 우선순위</text>

  <!-- 화살표 -->
  <line x1="155" y1="1030" x2="155" y2="1070" class="arrow"/>
  <line x1="425" y1="1030" x2="425" y2="1070" class="arrow"/>
  <line x1="695" y1="1030" x2="695" y2="1070" class="arrow"/>
  <line x1="905" y1="1030" x2="905" y2="1070" class="arrow"/>
  <line x1="50" y1="1090" x2="950" y2="1090" class="arrow"/>

  <!-- ========== LAYER 5: 출력 계층 ========== -->
  <text x="50" y="1130" class="label">📱 LAYER 5: 출력 계층 (Presentation)</text>

  <rect x="50" y="1150" width="200" height="100" rx="8" class="box"/>
  <text x="150" y="1175" text-anchor="middle" class="label">📱 모바일 앱</text>
  <text x="150" y="1200" text-anchor="middle" class="text">개인별 실시간</text>
  <text x="150" y="1220" text-anchor="middle" class="text">대피 경로</text>

  <rect x="310" y="1150" width="200" height="100" rx="8" class="box"/>
  <text x="410" y="1175" text-anchor="middle" class="label">🥽 HMD</text>
  <text x="410" y="1200" text-anchor="middle" class="text">음성 + 시각</text>
  <text x="410" y="1220" text-anchor="middle" class="text">AR 헤드셋</text>

  <rect x="570" y="1150" width="200" height="100" rx="8" class="box"/>
  <text x="670" y="1175" text-anchor="middle" class="label">📊 대시보드</text>
  <text x="670" y="1200" text-anchor="middle" class="text">관제센터</text>
  <text x="670" y="1220" text-anchor="middle" class="text">대피 현황</text>

  <rect x="830" y="1150" width="120" height="100" rx="8" class="box"/>
  <text x="890" y="1175" text-anchor="middle" class="label">📡 WiFi</text>
  <text x="890" y="1200" text-anchor="middle" class="text">비콘</text>
  <text x="890" y="1220" text-anchor="middle" class="text">위치기반</text>

  <!-- ========== 범례 ========== -->
  <text x="50" y="1310" class="label">📌 성능 지표</text>

  <g>
    <rect x="50" y="1330" width="900" height="50" rx="4" style="fill: #F3F4F6; stroke: #D1D5DB; stroke-width: 1;"/>
    <text x="70" y="1350" class="text">⚡ 응답시간: &lt;100ms (6,000명 경로 계산) | 📊 갱신주기: 60+ Hz (매 프레임) | 🎯 정확도: 90%+ (물리+AI 결합)</text>
    <text x="70" y="1370" class="text">✅ 충돌해소: 100% 보장 | 📍 위치정밀도: 2~3m | ⏱️ 대피시간: 11분 (기존 18분 대비 40% 단축)</text>
  </g>

</svg>